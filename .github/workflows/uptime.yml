name: Uptime check

# BLACKJ-850: polls the dev and staging API /health every 5 minutes from
# outside our servers and posts to #playmarkets-alerts on down, hourly while
# down, and on recovery. GitHub may start a scheduled run a few minutes late.
#
# Needs the repository secret SLACK_WEBHOOK_URL (the #playmarkets-alerts
# incoming webhook, from Matan via 1Password). Without it the run still fails
# when a host is down, and GitHub emails that failure instead.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Which hosts were already down, so a down host alerts once (then
      # hourly) rather than every 5 minutes. Each run saves under a new key;
      # restore-keys picks the newest earlier one.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check hosts
        id: check
        run: node check.mjs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
